<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyCast | Ekansh</title>

<meta name="theme-color" content="#6ea8ff">

<style>
/* ================= RESET ================= */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  min-height:100vh;
  padding:16px;
  color:#fff;
  background:linear-gradient(180deg,#6ea8ff,#a0ccff);
  transition:background 1s ease;
  overflow-x:hidden;
}

/* ================= CONTAINER ================= */
.container{max-width:430px;margin:auto}
@media(min-width:900px){.container{max-width:1100px}}

/* ================= SEARCH ================= */
.search-wrap{position:relative;margin-bottom:18px}
.search{
  display:flex;gap:10px;
  background:#fff;
  border-radius:40px;
  padding:12px 18px;
}
.search input{
  border:none;outline:none;flex:1;font-size:16px
}
.search button{
  border:none;background:none;font-size:18px;cursor:pointer
}
.suggestions{
  position:absolute;top:58px;left:0;right:0;
  background:#fff;border-radius:14px;
  overflow:hidden;display:none;z-index:10
}
.suggestions div{
  padding:12px 16px;color:#000;cursor:pointer
}
.suggestions div:hover{background:#eee}

/* ================= HERO ================= */
.hero h1{font-size:22px;font-weight:400}
.temp{font-size:72px;font-weight:300}
.desc{font-size:18px;margin-top:-6px}
.meta{
  margin-top:6px;
  background:rgba(0,0,0,.25);
  display:inline-block;
  padding:6px 14px;
  border-radius:20px;
  font-size:13px;
}
@media(min-width:900px){
  .hero h1{font-size:30px}
  .temp{font-size:88px}
}

/* ================= CARD ================= */
.card{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(28px);
  border-radius:28px;
  padding:18px;
  margin-bottom:22px;
}
.card>b{
  display:block;
  font-size:15px;
  margin-bottom:12px;
}

/* ================= HOURLY ================= */
.hourly{display:flex;gap:18px;overflow-x:auto}
.hour{text-align:center;min-width:56px;opacity:.85}
.hour img{width:24px}

/* ================= GRID ================= */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.metric{
  background:rgba(255,255,255,.14);
  border-radius:18px;
  padding:14px 16px;
}
.metric span{font-size:11px;opacity:.65}
.metric b{font-size:20px;font-weight:600}

/* ================= RAIN BAR ================= */
.rainbar{height:8px;background:#fff3;border-radius:10px}
.rainbar div{height:100%;background:#4fc3f7}

/* ================= AQI BAR ================= */
.aqi-bar{
  height:10px;border-radius:10px;
  background:linear-gradient(
    90deg,#00e400,#ffff00,#ff7e00,#ff0000,#7e0023
  );
}

/* ================= DESKTOP PAIRS ================= */
@media(min-width:900px){
  .desktop-pair{display:grid;grid-template-columns:1fr 1fr;gap:22px}
}

/* ================= MAP ================= */
.map iframe{width:100%;height:240px;border:none;border-radius:22px}

/* ================= CITY LIST ================= */
.city{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.15);
  cursor:pointer
}
.city:last-child{border-bottom:none}

/* ================= WEATHER THEMES ================= */
.weather-sunny{background:linear-gradient(180deg,#7fc8ff,#ffe29f)}
.weather-cloudy{background:linear-gradient(180deg,#8fa3b8,#b7c6d8)}
.weather-rain{background:linear-gradient(180deg,#4b79a1,#283e51)}
.weather-mist{background:linear-gradient(180deg,#a9b7c6,#cfd8e3)}
.weather-night{background:linear-gradient(180deg,#0f2027,#203a43,#2c5364)}

.weather-rain::before{
  content:"";position:fixed;inset:0;
  background:repeating-linear-gradient(
    120deg,rgba(255,255,255,.12) 0 1px,transparent 1px 6px
  );
  animation:rain .5s linear infinite;pointer-events:none
}
@keyframes rain{to{background-position:-20px 40px}}

.weather-night::before{
  content:"";position:fixed;inset:0;
  background:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(2px 2px at 70% 20%,#fff,transparent),
    radial-gradient(2px 2px at 40% 80%,#fff,transparent);
  animation:stars 3s ease-in-out infinite alternate;
  pointer-events:none
}
@keyframes stars{from{opacity:.4}to{opacity:.9}}
/* 🔒 Lock Sun & Moon to 2×2 always */
.sun-moon-grid {
  grid-template-columns: 1fr 1fr !important;
}
/* ================= WEATHER THEMES ================= */

/* ☀️ Sunny */
.weather-sunny {
  background: linear-gradient(180deg,#7fc8ff,#ffe29f);
}

/* ☁️ Cloudy */
.weather-cloudy {
  background: linear-gradient(180deg,#8fa3b8,#b7c6d8);
}

/* 🌧 Rain */
.weather-rain {
  background: linear-gradient(180deg,#4b79a1,#283e51);
}

/* 🌫 Mist / Fog */
.weather-mist {
  background: linear-gradient(180deg,#a9b7c6,#cfd8e3);
}

/* 🌙 Night */
.weather-night {
  background: linear-gradient(180deg,#0f2027,#203a43,#2c5364);
}

/* 🌧 Rain animation overlay */
.weather-rain::before {
  content:"";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    120deg,
    rgba(255,255,255,.12) 0 1px,
    transparent 1px 6px
  );
  animation: rainMove .5s linear infinite;
  pointer-events: none;
}
@keyframes rainMove {
  to { background-position: -20px 40px; }
}

/* 🌙 Stars for night */
.weather-night::before {
  content:"";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(2px 2px at 70% 20%,#fff,transparent),
    radial-gradient(2px 2px at 40% 80%,#fff,transparent);
  animation: stars 3s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes stars {
  from { opacity: .4; }
  to   { opacity: .9; }
}
</style>
</head>

<body class="weather-default">
<div class="container">

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search">
    <input id="cityInput" placeholder="Search city, state">
    <button onclick="search()">🔍</button>
  </div>
  <div id="suggestions" class="suggestions"></div>
</div>

<!-- HERO -->
<div class="hero">
  <h1 id="loc">Delhi, India</h1>
  <div class="temp" id="temp">--°</div>
  <div class="desc" id="cond">---</div>
  <div class="meta" id="meta">--</div>
</div><br>

<div class="card">
<b>Hourly Forecast</b>
<div class="hourly" id="hourly"></div>
</div>

<div class="card">
<b>Downpour Chances</b>
<div class="rainbar"><div id="rainFill"></div></div>
<div id="rainText"></div>
</div>

<div class="card">
<b>Weather Details</b>
<div class="grid">
  <div class="metric"><span>Feels Like</span><br><b id="feel"></b></div>
  <div class="metric"><span>Wind</span><br><b id="wind"></b></div>
  <div class="metric"><span>Humidity</span><br><b id="hum"></b></div>
  <div class="metric"><span>Visibility</span><br><b id="vis"></b></div>
  <div class="metric"><span>Pressure</span><br><b id="pres"></b></div>
  <div class="metric"><span>UV Index</span><br><b id="uv"></b></div>
</div>
</div>

<div class="desktop-pair">
<div class="card">
<b>AQI</b>
<div id="aqiNum"></div><br>
<div id="aqiLabel"></div><br>
<div class="aqi-bar"></div><br>
</div>

<div class="card">
<b>Outdoor Advice</b>
<div id="verdict"></div>
</div>
</div>

<div class="card">
  <b>Daily Events</b>
  <div class="grid sun-moon-grid">
    <div class="metric"><span>Sunrise</span><br><b id="sunrise"></b></div>
    <div class="metric"><span>Sunset</span><br><b id="sunset"></b></div>
    <div class="metric"><span>Moon Phase</span><br><b id="moon"></b></div>
    <div class="metric"><span>Illumination</span><br><b id="illum"></b></div>
  </div>
</div>

<div class="card">
<b>Next 3 Days</b>
<div id="days"></div>
</div>

<div class="desktop-pair">
<div class="card">
<b>Rain Radar</b>
<div class="map"><iframe id="rainRadar"></iframe></div>
</div>
<div class="card">
<b>Air Quality Map</b>
<div class="map">
<iframe   src="https://www.iqair.com/air-quality-map?embed=true"
  loading="lazy"
  referrerpolicy="no-referrer">
</iframe>
</div>
</div>
</div>

<div class="card">
<b>India : Major Cities & State Capitals</b>
<div id="cityList"></div>
</div>

</div>

<script>
const KEY="fec68ebf3d3341e09f295825251712";

/* AQI */
function indianAQI(pm){
  if(pm<=30) return pm/30*50;
  if(pm<=60) return 50+(pm-30)/30*50;
  if(pm<=90) return 100+(pm-60)/30*100;
  if(pm<=120) return 200+(pm-90)/30*100;
  if(pm<=250) return 300+(pm-120)/130*100;
  return 500;
}
function aqiLabelText(a){
  return a<=50?"Good":a<=100?"Satisfactory":a<=200?"Moderate":
         a<=300?"Poor":a<=400?"Very Poor":"Severe";
}

/* MAIN WEATHER */
async function loadWeather(q){
  const r=await fetch(`https://api.weatherapi.com/v1/forecast.json?key=${KEY}&q=${q}&days=7&aqi=yes`);
  const d=await r.json();

  document.body.classList.remove(
  "weather-sunny",
  "weather-cloudy",
  "weather-rain",
  "weather-mist",
  "weather-night"
);
  const t = d.current.condition.text.toLowerCase();

if (d.current.is_day === 0) {
  document.body.classList.add("weather-night");
}
else if (t.includes("rain")) {
  document.body.classList.add("weather-rain");
}
else if (t.includes("cloud")) {
  document.body.classList.add("weather-cloudy");
}
else if (t.includes("mist") || t.includes("fog") || t.includes("haze")) {
  document.body.classList.add("weather-mist");
}
else {
  document.body.classList.add("weather-sunny");
}

  loc.innerText=`${d.location.name}, ${d.location.country}`;
  temp.innerText=Math.round(d.current.temp_c)+"°";
  cond.innerText=d.current.condition.text;
  meta.innerText=`H:${Math.round(d.forecast.forecastday[0].day.maxtemp_c)}° L:${Math.round(d.forecast.forecastday[0].day.mintemp_c)}°`;

  feel.innerText=Math.round(d.current.feelslike_c)+"°";
  wind.innerText=d.current.wind_kph+" km/h";
  hum.innerText=d.current.humidity+"%";
  vis.innerText=d.current.vis_km+" km";
  pres.innerText=d.current.pressure_mb+" mb";
  uv.innerText=d.current.uv;

  const aqi=Math.round(indianAQI(d.current.air_quality.pm2_5));
  aqiNum.innerText="AQI "+aqi;
  aqiLabel.innerText=aqiLabelText(aqi);

  const rain=d.forecast.forecastday[0].hour[0].chance_of_rain;
  rainFill.style.width=rain+"%";
  rainText.innerText=rain+"% chance";

  verdict.innerText=
    aqi>200||rain>70?"Avoid going outside!!":
    aqi>100||rain>40?"Limit outdoor activity!":
    "Good to go outside :)";

  sunrise.innerText=d.forecast.forecastday[0].astro.sunrise;
  sunset.innerText=d.forecast.forecastday[0].astro.sunset;
  moon.innerText=d.forecast.forecastday[0].astro.moon_phase;
  illum.innerText=d.forecast.forecastday[0].astro.moon_illumination+"%";

  hourly.innerHTML=d.forecast.forecastday[0].hour.slice(0,12).map(h=>`
    <div class="hour">
      <div>${h.time.split(" ")[1]}</div>
      <img src="https:${h.condition.icon}">
      <b>${Math.round(h.temp_c)}°</b>
    </div>`).join("");

  days.innerHTML=d.forecast.forecastday.slice(0,3).map(f=>`
    <div class="city">
      <div>${f.date}</div>
      <div>${Math.round(f.day.mintemp_c)}° / ${Math.round(f.day.maxtemp_c)}°</div>
    </div>`).join("");

  rainRadar.src=`https://www.rainviewer.com/map.html?loc=${d.location.lat},${d.location.lon},6&oFa=0&oC=1&oU=0&oCS=1&c=1&lm=1`;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* SEARCH */
cityInput.addEventListener("input",async e=>{
  const q=e.target.value.trim();
  if(q.length<2){suggestions.style.display="none";return}
  const r=await fetch(`https://api.weatherapi.com/v1/search.json?key=${KEY}&q=${q}`);
  const data=await r.json();
  suggestions.innerHTML=data.map(c=>`
    <div onclick="selectCity('${c.name}, ${c.region}, ${c.country}')">
      ${c.name}, ${c.region}, ${c.country}
    </div>`).join("");
  suggestions.style.display="block";
});
function selectCity(v){
  cityInput.value=v;
  suggestions.style.display="none";
  cityInput.blur();
  loadWeather(v);
}
function search(){
  loadWeather(cityInput.value||"Delhi, India");
  cityInput.blur();
  suggestions.style.display="none";
}

/* CITY LIST */
const INDIA_CITIES=[
  "Delhi","Mumbai","Kolkata","Chennai","Bengaluru","Hyderabad",
  "Jaipur","Lucknow","Patna","Bhopal","Raipur","Ranchi",
  "Chandigarh","Shimla","Dehradun","Srinagar",
  "Thiruvananthapuram","Guwahati","Shillong","Gangtok",
  "Aizawl","Imphal","Agartala","Panaji","Bhubaneswar"
];

async function loadCityList(){
  cityList.innerHTML="";
  for(const c of INDIA_CITIES){
    const r=await fetch(`https://api.weatherapi.com/v1/current.json?key=${KEY}&q=${c},India`);
    const d=await r.json();
    cityList.innerHTML+=`
      <div class="city" onclick="loadWeather('${d.location.name}, India')">
        <div>
          <b>${d.location.name}</b><br>
          <small>${d.current.condition.text}</small>
        </div>
        <div>${Math.round(d.current.temp_c)}°</div>
      </div>`;
  }
}

/* INIT */
loadWeather("Delhi, India");
loadCityList();
</script>
</body>
</html>
